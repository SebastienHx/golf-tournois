<app-admin-lock *ngIf="isUnlocked()" (unlocked)="onUnlock($event)"></app-admin-lock>

<section class="admin-content" *ngIf="!isUnlocked()">
  <h1>Admin page unlocked</h1>
  <p>Access granted. You can now manage admin options.</p>

  <div class="admin-actions">
    <button type="button" (click)="openPlayerManagement()">Manage players</button>
    <button type="button" (click)="openFoursomeDuoManagement()">Manage foursomes</button>
  </div>
</section>
