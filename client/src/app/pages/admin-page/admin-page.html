<div class="page-container">
  <header class="page-header">
    <a routerLink="/board-page" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to board
    </a>
    <h1>Administration</h1>
    <p class="subtitle">Gérer ici les joueurs et les foursomes du tournoi.</p>
  </header>

  <app-admin-lock *ngIf="isUnlocked()" (unlocked)="onUnlock($event)"></app-admin-lock>

  <section class="admin-content" *ngIf="!isUnlocked()">
    <div class="admin-card">
      <div class="card-header">
        <h2>Admin tools</h2>
        <span class="badge">Unlocked</span>
      </div>

      <p class="intro">Accès autorisé. Vous pouvez gérer désormais le tournoi.</p>

      <div class="admin-actions">
        <button type="button" class="action-button primary" (click)="openDetailedScoreTournament()">
          Pointage global du tournoi
        </button>
        <button type="button" class="action-button" (click)="openPlayerManagement()">
          Gérer les joueurs
        </button>
        <button type="button" class="action-button" (click)="openFoursomeDuoManagement()">
          Gérer les foursomes
        </button>
      </div>
    </div>
  </section>
</div>
